<!DOCTYPE html>
<html>
<head>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0C1417; width:1600px; height:900px; overflow:hidden; }
  iframe { width:1600px; height:900px; border:none; }
</style>
</head>
<body>
<iframe id="f" src="index.html"></iframe>
<script>
  document.getElementById('f').onload = function() {
    try {
      var w = this.contentWindow;
      w.fit();
    } catch(e) {}
  };
</script>
</body>
</html>
